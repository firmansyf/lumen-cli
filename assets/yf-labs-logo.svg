<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="yfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="396" height="96" rx="16" fill="url(#badgeGrad)" stroke="url(#yfGrad)" stroke-width="2" />

  <!-- YF Monogram Shield using icon.svg design -->
  <g transform="translate(24, 18)">
    <!-- Brand Container -->
    <rect width="64" height="64" rx="14" fill="#0f172a" stroke="url(#yfGrad)" stroke-width="2" />
    <g transform="scale(2)">
      <!-- YF Geometric Monogram -->
      <path d="M6 7L16 16.5L26 7" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M16 16.5V26" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" />
      <path d="M16 21H23.5" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" />
      <!-- Studio Status Emerald Node -->
      <circle cx="16" cy="16.5" r="1.8" fill="#10B981" />
    </g>
  </g>

  <!-- YF LABS Text -->
  <text x="104" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2" fill="#f8fafc">
    YF <tspan fill="url(#yfGrad)">LABS</tspan>
  </text>

  <!-- Subtitle -->
  <text x="104" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="1" fill="#94a3b8">
    RESEARCH &amp; DEVELOPER TOOLING
  </text>
</svg>
